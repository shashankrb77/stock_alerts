name: Scheduled Workflow

on:
  schedule:
    - cron: "30 12 * * *"  # Every day at 6 PM IST

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_API_URL: ${{ secrets.TELEGRAM_API_URL }}
      ANCHOR_URL: ${{ secrets.ANCHOR_URL }}
      ANCHOR_ALERT_CUT_OFF_DAYS: ${{ secrets.ANCHOR_ALERT_CUT_OFF_DAYS }}
      IPO_URL: ${{ secrets.IPO_URL }}
      IPO_ALERT_CUT_OFF_DAYS: ${{ secrets.IPO_ALERT_CUT_OFF_DAYS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main script
        run: python main.py
